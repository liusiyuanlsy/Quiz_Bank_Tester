[project]
name = "quiz-bank-tester"
version = "1.0.0"
description = "基金考试题库系统 - 专为基金从业资格考试、银行内部资格认证等考试设计的选择题题库测试系统"
readme = "README.md"
authors = [
    {name = "Sylvan_930", email = ""}
]
license = {text = "Mulan PSL v2"}
keywords = ["quiz", "exam", "bank", "fund", "education", "tkinter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Mulan Permissive Software License v2 (MulanPSL-2.0)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education :: Testing",
    "Topic :: Office/Business",
]
requires-python = ">=3.13"
dependencies = [
    "lxml>=5.4.0",
    "pillow>=11.2.1",
    "python-docx>=1.1.2",
]

[dependency-groups]
build = [
    "pyinstaller>=6.13.0",
]

[project.urls]
Homepage = "https://gitee.com/liusiyuanlsy/Quiz_Bank_Tester"
Repository = "https://gitee.com/liusiyuanlsy/Quiz_Bank_Tester"
Issues = "https://gitee.com/liusiyuanlsy/Quiz_Bank_Tester/issues"

[project.scripts]
quiz-bank-tester = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "controllers", "models", "services", "utils", "views"]

[tool.hatch.build.targets.sdist]
include = [
    "/config",
    "/controllers", 
    "/models",
    "/services",
    "/utils",
    "/views",
    "/main.py",
    "/icon.ico",
    "/README.md",
    "/LICENSE",
]
